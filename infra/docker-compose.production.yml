volumes:
  pg_data:
  static:
  media:

services:

  db:
    image: postgres:14
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    image: dariakol/foodgram_backend
    env_file: .env
    container_name: foodgram-back
    depends_on:
      - db
    volumes:
      - static:/app/static
      - media:/app/media

  frontend:
    env_file: .env
    image: dariakol/foodgram_frontend
    command: cp -r /app/build/. /app/static/
    container_name: foodgram-front
    volumes:
      - static:/app/static
  gateway:
    container_name: foodgram-proxy
    image: dariakol/foodgram_gateway
    env_file: .env
    depends_on:
      - backend
    ports:
      - 8000:80
    volumes:
      - static:/app/static
      - media:/app/media